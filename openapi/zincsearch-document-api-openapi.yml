components:
  schemas:
    meta.HTTPResponseRecordCount:
      type: object
      properties:
        message:
          type: string
        record_count:
          type: integer
    meta.HTTPResponseID:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
    meta.Hit:
      type: object
      properties:
        '@timestamp':
          type: string
        _id:
          type: string
        _index:
          type: string
        _score:
          type: number
        _source: {}
        _type:
          type: string
        fields:
          type: object
          additionalProperties: true
        highlight:
          type: object
          additionalProperties: true
    meta.JSONIngest:
      type: object
      properties:
        index:
          type: string
        records:
          type: array
          items:
            type: object
            additionalProperties: true
    meta.HTTPResponseDocument:
      type: object
      properties:
        id:
          type: string
        index:
          type: string
        message:
          type: string
    meta.HTTPResponseError:
      type: object
      properties:
        error:
          type: string
  securitySchemes:
