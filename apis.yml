aid: zincsearch
name: ZincSearch
image: https://openobserve.ai/o2-seo-image.png
description: ZincSearch is an open source, self-hosted, lightweight full-text search
  engine written in Go (Apache 2.0) with an Elasticsearch-compatible ingestion and
  search API, built by Zinc Labs. The company now develops OpenObserve as its successor,
  and zincsearch.com redirects to openobserve.ai.
